# Save as /etc/apache2/conf.d/userdata/ssl/2_4/<cpanel-user>/<mcp-domain>/cpmoshai.conf
# then run: /usr/local/cpanel/scripts/rebuildhttpdconf && systemctl restart httpd
# Requires ea-apache2-mod_proxy and ea-apache2-mod_proxy_http, and an AutoSSL certificate on the domain.

ProxyPreserveHost On
ProxyTimeout 60

<Location "/mcp">
    ProxyPass "unix:/run/cpmoshai/mcp.sock|http://localhost/mcp"
</Location>

Header always set Strict-Transport-Security "max-age=63072000"
